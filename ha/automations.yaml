- id: '1722839354487'
  alias: Amp_Casting_On
  description: Turn amp on via IR blaster when kitchen cast group or andys cast starts
    playing
  triggers:
  - platform: state
    entity_id:
    - media_player.kitchen
    - media_player.andys_cast
    to: playing
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      qos: '0'
      retain: false
      topic: zigbee2mqtt/IR_Blaster/set
      payload: '{"ir_code_to_send": "A4YDGwPAAwMAB4YD4AEBA0cRhgNAAYAVgAXgCwFAGQ///4YDhgOGA4YDhgOGAxsD"}'
  mode: restart
- id: '1722840136733'
  alias: Amp_Casting_IdleOFF
  description: Turn amp off via IR blaster when kitchen cast group or andys cast goes
    idle for 3s
  triggers:
  - platform: state
    entity_id:
    - media_player.kitchen
    - media_player.andys_cast
    to: idle
    for:
      seconds: 3
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.kitchen
      state: playing
    - condition: state
      entity_id: media_player.andys_cast
      state: playing
  actions:
  - action: mqtt.publish
    data:
      qos: '0'
      retain: false
      topic: zigbee2mqtt/IR_Blaster/set
      payload: '{"ir_code_to_send": "BYADgAP9BkABAYAD4AEBA0sRgANAAYAVgAXgBwEL/Qb9Bv//gAOAA/0GQAEBgAPgAQHgXD8CBv0G"}'
  mode: restart
- id: '1722840909529'
  alias: Aircon_Off_11pm
  description: 'Hard stop: turn the living-room aircon off every day at 11pm.'
  triggers:
  - trigger: time
    at: '23:00:00'
  conditions: []
  actions:
  - action: climate.turn_off
    target:
      entity_id: climate.living_room_aircon
  mode: single
- id: '1722841776503'
  alias: Aircon_Heat_Cold_Morning_6am
  description: At 6am, if the living-room sensor is below 20C, heat to 22C with
    maximum fan and full swing for the pre-wake period.
  triggers:
  - trigger: time
    at: 06:00:00
  conditions:
  - condition: numeric_state
    entity_id: sensor.living_room_temperature
    below: 20
  actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.living_room_aircon
    data:
      hvac_mode: heat
      temperature: 22
  - action: climate.set_fan_mode
    target:
      entity_id: climate.living_room_aircon
    data:
      fan_mode: high
  - action: climate.set_swing_mode
    target:
      entity_id: climate.living_room_aircon
    data:
      swing_mode: both
  mode: single
- id: aircon_morning_airflow_7am
  alias: Aircon_Morning_Airflow_7am
  description: At 7am, if morning heating is still running, return the fan to auto
    and retain vertical swing for occupied-room comfort.
  triggers:
  - trigger: time
    at: 07:00:00
  conditions:
  - condition: state
    entity_id: climate.living_room_aircon
    state: heat
  actions:
  - action: climate.set_fan_mode
    target:
      entity_id: climate.living_room_aircon
    data:
      fan_mode: auto
  - action: climate.set_swing_mode
    target:
      entity_id: climate.living_room_aircon
    data:
      swing_mode: vertical
  mode: single
