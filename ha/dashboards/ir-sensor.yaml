    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.imarga43_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_dawn
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.sensor_masterbedroom_temperature
- title: Dental Hub
  path: dental-hub
  icon: mdi:toothbrush-electric
  cards:
  - type: horizontal-stack
    cards:
    - type: vertical-stack
      cards:
      - type: markdown
        content: '## 🦷 Andy''s Brushing Stats'
      - type: horizontal-stack
        cards:
        - type: gauge
          entity: input_number.daily_brush_events_andy
          name: Events Today
          min: 0
          max: 2
          severity:
            red: 0
            yellow: 1
            green: 2
        - type: gauge
          entity: input_number.daily_brush_time_andy
          name: Time Today
          unit: s
          min: 0
          max: 240
          severity:
            red: 0
            yellow: 120
            green: 240
