game_slug: carmen-sandiegos-great-chase-through-time
version: "CD + Windows 95 (local)"
slug: carmen-sandiegos-great-chase-through-time-cd-windows-95-local
installer_slug: carmen-sandiegos-great-chase-through-time-cd-windows-95-local
name: Carmen Sandiego's Great Chase Through Time
year: 1997
runner: linux
description: >-
  Carmen Sandiego's Great Chase Through Time installed into the pinned Windows
  95 OSR2.5 DOSBox Pure Unleashed image.
notes: |
  This installer uses DOSBox Pure Unleashed with the working CDN Windows 95
  OSR2.5 image and both game discs. The CDN image is used instead of the
  official 2Go URL because that URL currently returns HTTP 403.

  Boot Windows 95 with disc 1 (CS_TIME1.iso) mounted as drive E:. Do not run
  the root SETUP.EXE: it is a 16-bit installer. Open Install/SETUP32.EXE,
  choose Install/Uninstall, install QuickTime 2.1.2, and choose Skip when the
  installer asks to scan for an installed version.

  Both discs are passed to DOSBox Pure Unleashed so it can switch discs. Before
  switching to disc 2, disable Auto Insert Notification in the Windows 95
  CD-ROM device settings and reboot Windows 95. Press Ctrl+F12 to open the
  DOSBox Pure Unleashed menu, then use its disc-swap control when the game asks
  for the other disc.
script:
  files:
    - os_img:
        filename: WIN95_OSR25_DBP.7z
        url: https://lutris.nyc3.cdn.digitaloceanspaces.com/games/Windows_95/WIN95_OSR25_DBP.7z
        checksum: "sha256:1d6718c08407fcaf6a8c8cee9f567401f7e3cea15a7c2a9cd851839ca7671426"
    - dbpu_file:
        filename: dosbox-pure-unleashed.tar.xz
        url: https://github.com/legluondunet/mlls-tools/raw/5ed13e300e2ae636817839d741f49c5049d6b139/DOSBox/dosbox-pure-unleashed.tar.xz
        checksum: "sha256:4b4cdbdb284c16bc172c37ef7b6d6f56baccc82490b4dbde7c14e8ea51a8f37d"
    - dbpu_save:
        filename: CS_TIME1.pure.zip
        url: https://github.com/legluondunet/MyLittleLutrisScripts/raw/89ab1505c1fd1de8ffc1aadfe55a3e155f15130d/Windows%2095/DOSBox-pure.pure.zip
        checksum: "sha256:43d2a404d66672b2621e1605b697ee32d3f0cc79373bd79fdca1c6b572a5da53"
    - game_cd_1:
        filename: CS_TIME1.iso
        url: https://archive.org/download/carmentime2/CS_TIME1.iso
        checksum: "sha1:6e1a678969d3bb0c02e887e72ff7693dddee3d18"
    - game_cd_2:
        filename: CARMENTIME2.iso
        url: https://archive.org/download/carmentime2/CARMENTIME2.iso
        checksum: "sha1:e2fdde702ed863596c6dc4a26f340daae41f05d5"
  game:
    args: '"$GAMEDIR/CD/CS_TIME1.iso" "$GAMEDIR/CD/CARMENTIME2.iso"'
    exe: $GAMEDIR/DOSBoxPure_x86_64
    working_dir: $GAMEDIR
  installer:
    - extract:
        dst: $GAMEDIR
        file: dbpu_file
    - extract:
        dst: $GAMEDIR/system
        src: os_img
    - merge:
        dst: $GAMEDIR/saves
        src: dbpu_save
    - merge:
        dst: $GAMEDIR/CD
        src: game_cd_1
    - merge:
        dst: $GAMEDIR/CD
        src: game_cd_2
